[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailyfit-agent"
version = "1.0.0"
description = "DailyFit Agent: source-attributed fitness and nutrition AI agent with Aliyun live mode, memory, guardian, audits, web UI, and benchmarks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DailyFit Agent Maintainers" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "langgraph>=0.2",
  "pydantic>=2.6",
  "rank-bm25>=0.2.2",
  "httpx>=0.26",
  "openai>=1.30",
  "python-dotenv>=1.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "SIM102", "SIM108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["."]
