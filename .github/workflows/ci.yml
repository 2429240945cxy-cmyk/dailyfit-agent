name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python backend/scripts/init_db.py
      - run: pytest backend/tests/ -v
      - run: python backend/scripts/scan_sensitive_tokens.py
      - run: DAILYFIT_MODE=demo_mock python backend/scripts/run_all_v2_benchmarks.py
      - run: python backend/scripts/verify_readme_numbers.py
