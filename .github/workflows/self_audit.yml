name: Self Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python backend/scripts/run_self_audit.py --dry-run
